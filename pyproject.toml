[project]
name = "paddockpal"
version = "0.1.0"
description = "Low-Latency Virtual Multi-Sim Race Engineer — Choose your pal before you go flying."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "fastf1>=3.4.0",
    "numpy<2.0.0",
    "pandas>=2.0.0,<2.2.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "BLE", "PERF"]
ignore = [
    "E501",   # line too long — formatter handles, not enforced in CI
    "E402",   # module-level import not at top — needed for sys.path bootstrap in server.py
    "B905",   # zip() strict — stdlib 3.10+, opt-in
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "personas", "telemetry", "mock_data", "ui"]
